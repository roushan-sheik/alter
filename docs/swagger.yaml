          $ref: '#/definitions/gotickets_internal_domain_user_dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_user_dto.MessageResponse'
        "400":
          description: Wrong current password
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Users
  /health:
    get:
      description: Returns API metadata and database connectivity status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.HealthResponse'
      summary: Health Check
      tags:
      - System
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT access token.
    in: header
    name: Authorization
    type: apiKey
