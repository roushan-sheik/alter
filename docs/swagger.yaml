basePath: /
definitions:
  gotickets_internal_domain_library_dto.CategoryResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  gotickets_internal_domain_library_dto.CreateCategoryReq:
    properties:
      name:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  gotickets_internal_domain_library_dto.CreateLibraryReq:
    properties:
      category:
        maxLength: 100
        type: string
      content_text:
        type: string
      media_url:
        type: string
      short_description:
        type: string
      thumbnail_url:
        type: string
      title:
        maxLength: 255
        type: string
    required:
    - category
    - content_text
    - short_description
    - thumbnail_url
    - title
    type: object
  gotickets_internal_domain_library_dto.LibraryDetailsResponse:
    properties:
      library_item:
        $ref: '#/definitions/gotickets_internal_domain_library_dto.LibraryResponse'
      related:
        items:
          $ref: '#/definitions/gotickets_internal_domain_library_dto.LibraryResponse'
        type: array
    type: object
  gotickets_internal_domain_library_dto.LibraryResponse:
    properties:
      category:
        type: string
      content_text:
        type: string
      created_at:
        type: string
      id:
        type: string
      media_url:
        type: string
      short_description:
        type: string
      thumbnail_url:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  gotickets_internal_domain_library_dto.PaginatedLibraryResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/gotickets_internal_domain_library_dto.LibraryResponse'
        type: array
      meta:
        $ref: '#/definitions/gotickets_internal_querybuilder.Meta'
    type: object
  gotickets_internal_domain_library_dto.UpdateCategoryReq:
    properties:
      name:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  gotickets_internal_domain_library_dto.UpdateLibraryReq:
    properties:
      category:
        maxLength: 100
        type: string
      content_text:
        type: string
      media_url:
        type: string
      short_description:
        type: string
      thumbnail_url:
        type: string
      title:
        maxLength: 255
        type: string
    required:
    - category
    - content_text
    - short_description
    - thumbnail_url
    - title
    type: object
  gotickets_internal_domain_motivation_dto.CreateMotivationReq:
    properties:
      description:
        type: string
      duration:
        maxLength: 20
        type: string
      speaker_name:
        maxLength: 255
        type: string
      thumbnail_url:
        type: string
      title:
        maxLength: 255
        type: string
      video_url:
        type: string
    required:
    - description
    - duration
    - speaker_name
    - thumbnail_url
    - title
    - video_url
    type: object
  gotickets_internal_domain_motivation_dto.MotivationDetailsResponse:
    properties:
      motivation:
        $ref: '#/definitions/gotickets_internal_domain_motivation_dto.MotivationResponse'
      related:
        items:
          $ref: '#/definitions/gotickets_internal_domain_motivation_dto.MotivationResponse'
        type: array
    type: object
  gotickets_internal_domain_motivation_dto.MotivationResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      duration:
        type: string
      id:
        type: string
      speaker_name:
        type: string
      thumbnail_url:
        type: string
      title:
        type: string
      updated_at:
        type: string
      video_url:
        type: string
    type: object
  gotickets_internal_domain_motivation_dto.PaginatedMotivationResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/gotickets_internal_domain_motivation_dto.MotivationResponse'
        type: array
      meta:
        $ref: '#/definitions/gotickets_internal_querybuilder.Meta'
    type: object
  gotickets_internal_domain_motivation_dto.UpdateMotivationReq:
    properties:
      description:
        type: string
      duration:
        maxLength: 20
        type: string
      speaker_name:
        maxLength: 255
        type: string
      thumbnail_url:
        type: string
      title:
        maxLength: 255
        type: string
      video_url:
        type: string
    required:
    - description
    - duration
    - speaker_name
    - thumbnail_url
    - title
    - video_url
    type: object
  gotickets_internal_domain_schedule_dto.ScheduleResponse:
    properties:
      id:
        example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        type: string
      morning_prayer_time:
        example: "08:00"
        type: string
      night_prayer_time:
        example: "22:00"
        type: string
      push_enabled:
        example: true
        type: boolean
      timezone:
        example: America/New_York
        type: string
      updated_at:
        example: "2026-08-17T15:00:00Z"
        type: string
      user_id:
        example: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e
        type: string
    type: object
  gotickets_internal_domain_schedule_dto.UpdateScheduleRequest:
    properties:
      morning_prayer_time:
        description: '"HH:MM" or "HH:MM:SS"'
        example: "08:00"
        type: string
      night_prayer_time:
        description: '"HH:MM" or "HH:MM:SS"'
        example: "22:00"
        type: string
      push_enabled:
        example: true
        type: boolean
      timezone:
        description: IANA tz
        example: America/New_York
        type: string
    required:
    - morning_prayer_time
    - night_prayer_time
    - push_enabled
    - timezone
    type: object
  gotickets_internal_domain_subscription_dto.MessageResponse:
    properties:
      message:
        example: Operation successful
        type: string
    type: object
  gotickets_internal_domain_subscription_dto.PlanResponse:
    properties:
      billing_interval:
        example: MONTHLY
        type: string
      code:
        example: PREMIUM_REQUIRED
        type: string
      currency:
        example: USD
        type: string
      id:
        example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        type: string
      name:
        example: John Doe
        type: string
      price_amount:
        example: 9.99
        type: number
    type: object
  gotickets_internal_domain_subscription_dto.SubscriptionResponse:
    properties:
      expires_at:
        example: "2026-09-17T15:00:00Z"
        type: string
      external_transaction_id:
        example: "1000000123456"
        type: string
      id:
        example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        type: string
      plan:
        $ref: '#/definitions/gotickets_internal_domain_subscription_dto.PlanResponse'
      start_date:
        example: "2026-08-17T15:00:00Z"
        type: string
      status:
        example: ACTIVE
        type: string
      store:
        example: APPLE
        type: string
      user_id:
        example: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e
        type: string
    type: object
  gotickets_internal_domain_subscription_dto.VerifyReceiptRequest:
    properties:
      receipt_payload:
        description: Raw receipt string / token from the store
        example: MIIT7wYJKoZIhvcNAQcCoIIT4D...
        type: string
      store:
        enum:
        - APPLE
        - GOOGLE
        example: APPLE
        type: string
    required:
    - receipt_payload
    - store
    type: object
  gotickets_internal_domain_subscription_dto.WebhookRequest:
    properties:
      payload:
        additionalProperties: true
        type: object
      store:
        example: APPLE
        type: string
    type: object
  gotickets_internal_domain_user_dto.AdminLoginRequest:
    properties:
      email:
        example: admin@altar.com
        type: string
      language_preference:
        description: 'Available languages: en (English), fr (French), es (Spanish),
          pt (Portuguese), ht (Haitian Creole)'
        enum:
        - en
        - fr
        - es
        - pt
        - ht
        example: en
        type: string
      password:
        example: Admin1234
        type: string
    required:
    - email
    - password
    type: object
  gotickets_internal_domain_user_dto.AuthDataResponse:
    properties:
      tokens:
        $ref: '#/definitions/gotickets_internal_domain_user_dto.TokenDTO'
      user:
        $ref: '#/definitions/gotickets_internal_domain_user_dto.UserDTO'
    type: object
  gotickets_internal_domain_user_dto.AuthResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsIn...
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsIn...
        type: string
    type: object
  gotickets_internal_domain_user_dto.AvatarResponse:
    properties:
      avatar_url:
        example: https://res.cloudinary.com/demo/image/upload/avatar.jpg
        type: string
    type: object
  gotickets_internal_domain_user_dto.ChangePasswordRequest:
    properties:
      confirm_password:
        example: NewSecret123!
        type: string
      new_password:
        example: NewSecret123!
        minLength: 8
        type: string
      old_password:
        example: Secret123!
        type: string
    required:
    - confirm_password
    - new_password
    - old_password
    type: object
  gotickets_internal_domain_user_dto.ForgotPasswordRequest:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  gotickets_internal_domain_user_dto.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      language_preference:
        description: 'Available languages: en (English), fr (French), es (Spanish),
          pt (Portuguese), ht (Haitian Creole)'
        enum:
        - en
        - fr
        - es
        - pt
        - ht
        example: en
        type: string
      password:
        example: Secret123!
        type: string
    required:
    - email
    - password
    type: object
  gotickets_internal_domain_user_dto.MessageResponse:
    properties:
      message:
        example: Operation successful
        type: string
    type: object
  gotickets_internal_domain_user_dto.ProfileResponse:
    properties:
      age:
        example: 25
        type: integer
      auth_provider:
        example: EMAIL
        type: string
      avatar_url:
        example: https://res.cloudinary.com/demo/image/upload/avatar.jpg
        type: string
      created_at:
        example: "2026-08-17T15:00:00Z"
        type: string
      email:
        example: user@example.com
        type: string
      id:
        example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        type: string
      is_premium:
        example: true
        type: boolean
      language_preference:
        example: en
        type: string
      location:
        example: New York, USA
        type: string
      name:
        example: John Doe
        type: string
      terms_accepted_at:
        example: "2026-08-17T15:00:00Z"
        type: string
      theme_preference:
        example: NAVY
        type: string
    type: object
  gotickets_internal_domain_user_dto.RefreshRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsIn...
        type: string
    type: object
  gotickets_internal_domain_user_dto.RegisterDeviceRequest:
    properties:
      platform:
        enum:
        - IOS
        - ANDROID
        example: IOS
        type: string
      token:
        example: fcm-token-123
        type: string
    required:
    - platform
    - token
    type: object
  gotickets_internal_domain_user_dto.RegisterRequest:
    properties:
      age:
        example: 25
        maximum: 120
        minimum: 0
        type: integer
      agreeTermsAndConditions:
        example: true
        type: boolean
      email:
        example: user@example.com
        type: string
      language_preference:
        description: 'Available languages: en (English), fr (French), es (Spanish),
          pt (Portuguese), ht (Haitian Creole)'
        enum:
        - en
        - fr
        - es
        - pt
        - ht
        example: en
        type: string
      name:
        example: John Doe
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: Secret123!
        minLength: 8
        type: string
    required:
    - age
    - agreeTermsAndConditions
    - email
    - name
    - password
    type: object
  gotickets_internal_domain_user_dto.ResendOTPRequest:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  gotickets_internal_domain_user_dto.ResetPasswordRequest:
    properties:
      new_password:
        example: NewSecret123!
        minLength: 8
        type: string
      reset_token:
        example: eyJhb...
        type: string
    required:
    - new_password
    - reset_token
    type: object
  gotickets_internal_domain_user_dto.SocialLoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      id_token:
        example: eyJhbGciOi...
        type: string
      name:
        example: John Doe
        type: string
      provider:
        enum:
        - google
        - apple
        example: google
        type: string
    required:
    - email
    - id_token
    - provider
    type: object
  gotickets_internal_domain_user_dto.StandardAuthResponse:
    properties:
      data:
        $ref: '#/definitions/gotickets_internal_domain_user_dto.AuthDataResponse'
      message:
        example: Login successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  gotickets_internal_domain_user_dto.StandardResponse:
    properties:
      data: {}
      message:
        example: Operation successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  gotickets_internal_domain_user_dto.TokenDTO:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsIn...
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsIn...
        type: string
    type: object
  gotickets_internal_domain_user_dto.UpdateProfileRequest:
    properties:
      age:
        example: 25
        maximum: 120
        minimum: 0
        type: integer
      language_preference:
        description: 'Available languages: en (English), fr (French), es (Spanish),
          pt (Portuguese), ht (Haitian Creole)'
        enum:
        - en
        - fr
        - es
        - pt
        - ht
        example: en
        type: string
      location:
        example: New York, USA
        type: string
      name:
        example: John Doe
        maxLength: 100
        minLength: 2
        type: string
      theme_preference:
        description: 'Available themes: LIGHT, DARK'
        enum:
        - LIGHT
        - DARK
        example: DARK
        type: string
    type: object
  gotickets_internal_domain_user_dto.UserDTO:
    properties:
      avatar_url:
        example: https://example.com/avatar.jpg
        type: string
      email:
        example: user@example.com
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      name:
        example: John Doe
        type: string
      role:
        example: user
        type: string
    type: object
  gotickets_internal_domain_user_dto.VerifyOTPRequest:
    properties:
      email:
        example: user@example.com
        type: string
      otp:
        example: "12345"
        type: string
    required:
    - email
    - otp
    type: object
  gotickets_internal_domain_user_dto.VerifyOTPResponse:
    properties:
      reset_token:
        example: eyJhbGciOiJIUzI1NiIsIn...
        type: string
    type: object
  gotickets_internal_httpresponse.Error:
    properties:
      code:
        type: integer
      details:
        type: string
      message:
        type: string
    type: object
  gotickets_internal_querybuilder.Meta:
    properties:
      limit:
        description: Limit is the number of items per page.
        type: integer
      page:
        description: Page is the current page number (1-indexed).
        type: integer
      total:
        description: Total is the total number of matching records.
        type: integer
      total_pages:
        description: TotalPages is the total number of pages.
        type: integer
    type: object
  internal_domain_media.DeleteRequest:
    properties:
      url:
        example: https://res.cloudinary.com/demo/image/upload/v1234/zick/uploads/abc.jpg
        type: string
    required:
    - url
    type: object
  internal_domain_media.DeleteResponse:
    properties:
      message:
        example: File deleted successfully
        type: string
    type: object
  internal_domain_media.UploadResponse:
    properties:
      public_id:
        example: zick/content/abc123
        type: string
      url:
        example: https://res.cloudinary.com/demo/image/upload/sample.jpg
        type: string
    type: object
  internal_server.HealthResponse:
    properties:
      database:
        type: string
      docs_url:
        type: string
      environment:
        type: string
      message:
        type: string
      status:
        type: string
      timestamp:
        type: string
      version:
        type: string
    type: object
  internal_server.WelcomeResponse:
    properties:
      docs_url:
        type: string
      environment:
        type: string
      message:
        type: string
      status:
        type: string
      version:
        type: string
    type: object
info:
  contact:
    email: support@zick.app
    name: ZICK API Support
  description: ZICK — A spiritual-wellness app backend providing auth, content, schedules,
    and subscriptions.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: ZICK API
  version: "2.0"
paths:
  /:
    get:
      description: Root endpoint — confirms the API is running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.WelcomeResponse'
      summary: Welcome
      tags:
      - System
  /api/v1/admin/library:
    post:
      consumes:
      - application/json
      description: Admin endpoint to create a new library item.
      parameters:
      - description: Library payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_library_dto.CreateLibraryReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/gotickets_internal_domain_library_dto.LibraryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Create a library item
      tags:
      - Library
  /api/v1/admin/library-categories:
    post:
      consumes:
      - application/json
      description: Admin endpoint to create a new category.
      parameters:
      - description: Category payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_library_dto.CreateCategoryReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/gotickets_internal_domain_library_dto.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Create a library category
      tags:
      - Library Categories
  /api/v1/admin/library-categories/{id}:
    delete:
      description: Admin endpoint to delete a category.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a library category
      tags:
      - Library Categories
    put:
      consumes:
      - application/json
      description: Admin endpoint to update a category.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Category payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_library_dto.UpdateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_library_dto.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Update a library category
      tags:
      - Library Categories
  /api/v1/admin/library/{id}:
    delete:
      consumes:
      - application/json
      description: Admin endpoint to delete an existing library item.
      parameters:
      - description: Library Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Delete a library item
      tags:
      - Library
    put:
      consumes:
      - application/json
      description: Admin endpoint to update an existing library item.
      parameters:
      - description: Library Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Library payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_library_dto.UpdateLibraryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_library_dto.LibraryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Update a library item
      tags:
      - Library
  /api/v1/admin/motivations:
    post:
      consumes:
      - application/json
      description: Admin endpoint to create a new motivation.
      parameters:
      - description: Motivation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_motivation_dto.CreateMotivationReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/gotickets_internal_domain_motivation_dto.MotivationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Create a motivation
      tags:
      - Motivation
  /api/v1/admin/motivations/{id}:
    delete:
      consumes:
      - application/json
      description: Admin endpoint to delete an existing motivation.
      parameters:
      - description: Motivation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Delete a motivation
      tags:
      - Motivation
    put:
      consumes:
      - application/json
      description: Admin endpoint to update an existing motivation.
      parameters:
      - description: Motivation ID
        in: path
        name: id
        required: true
        type: string
      - description: Motivation payload
        in: body
        name: request
        required: true
