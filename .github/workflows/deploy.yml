name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: "10m"
          script: |
            set -e
            START_TIME=$(date +%s)

            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Detect compose command
            if docker compose version > /dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            # Backup .env before git operations
            cp .env /tmp/.env.gotickets.backup

            # Save rollback point
            PREV_COMMIT=$(git rev-parse HEAD)

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Restore .env if wiped by git reset
            [ ! -f .env ] && cp /tmp/.env.gotickets.backup .env

            DEPLOY_COMMIT=$(git rev-parse --short HEAD)

            # Zero-downtime restart (app only)
            $COMPOSE up -d --build --no-deps app

            # Wait for services to stabilize
            sleep 15

            # Health check with retry
            HEALTH_URL="http://localhost:${{ secrets.APP_PORT }}/health"
            MAX_RETRIES=12
            RETRY_DELAY=5
            ATTEMPT=0

            until curl --fail --silent --max-time 5 "$HEALTH_URL" > /dev/null; do
              ATTEMPT=$((ATTEMPT + 1))
              if [ "$ATTEMPT" -ge "$MAX_RETRIES" ]; then
                echo "Health check failed after $((MAX_RETRIES * RETRY_DELAY))s"
                $COMPOSE logs --tail=80 app

                # Rollback
                echo "Rolling back to $PREV_COMMIT..."
                git reset --hard "$PREV_COMMIT"
                $COMPOSE up -d --build --no-deps app

                echo "DEPLOY FAILED — rolled back to $PREV_COMMIT"
                exit 1
              fi
              echo "Waiting... attempt $ATTEMPT/$MAX_RETRIES"
              sleep "$RETRY_DELAY"
            done

            echo "✅ Health check passed."
            echo "🚀 Deploy complete"
