name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  build:
    name: Build and Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x" # Adjust if you are using a different Go version
          
      - name: Install dependencies
        run: go mod download
        
      - name: Vet
        run: go vet ./...
        
      - name: Build
        run: go build -v ./...
