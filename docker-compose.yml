services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: altar_app
    ports:
      - "${PORT:-5525}:${PORT:-5525}"
    env_file:
      - .env
    # Allows the container to reach the host machine's PostgreSQL via 'host.docker.internal'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - altar_network

networks:
  altar_network:
    driver: bridge
